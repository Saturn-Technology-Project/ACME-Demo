# Deploy ACME Demo System to Cloud Run.
#
# GitHub variables:
#   GCP_PROJECT_ID          required
#   GCP_REGION              default asia-east1
#   CLOUD_RUN_SERVICE       default acme-demo
#
# GitHub secrets:
#   GCP_WORKLOAD_IDENTITY_PROVIDER
#     projects/629072855899/locations/global/workloadIdentityPools/github/providers/saturn
#   GCP_SERVICE_ACCOUNT
#     github-deployer@project-5ae7d09e-f273-4da2-891.iam.gserviceaccount.com
#
# Service account roles: Artifact Registry Writer, Cloud Run Admin,
# Service Account User (on the Cloud Run runtime SA).

name: Deploy Cloud Run

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: cloud-run-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  REGION: ${{ vars.GCP_REGION || 'asia-east1' }}
  SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'acme-demo' }}
  REPOSITORY: acme

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check GCP project
        run: |
          if [ -z "${{ vars.GCP_PROJECT_ID }}" ]; then
            echo "Set repository variable GCP_PROJECT_ID" >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Enable APIs
        run: |
          gcloud services enable \
            run.googleapis.com \
            artifactregistry.googleapis.com \
            iamcredentials.googleapis.com \
            --quiet

      - name: Ensure Artifact Registry repository
        run: |
          gcloud artifacts repositories describe "$REPOSITORY" --location="$REGION" \
            || gcloud artifacts repositories create "$REPOSITORY" \
              --repository-format=docker \
              --location="$REGION" \
              --description="ACME demo images"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build and push image
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}
        run: |
          docker build \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
            .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}
          env_vars: |
            SQLITE_PATH=/tmp/acme.sqlite
            PUBLIC_DIR=/app/public
            NODE_OPTIONS=--experimental-sqlite
          flags: >-
            --allow-unauthenticated
            --port=4000
            --memory=512Mi
            --cpu=1
            --max-instances=1

      - name: Service URL
        run: echo "${{ steps.deploy.outputs.url }}"
