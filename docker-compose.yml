name: acme

services:
  demo:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 4000
      SQLITE_PATH: /app/data/acme.sqlite
      PUBLIC_DIR: /app/public
      NODE_OPTIONS: --experimental-sqlite
    ports:
      - "3002:4000"
    volumes:
      - acme_data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  acme_data:
